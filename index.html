<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johana, te amo ❤️</title>
  <meta name="description" content="Página especial para Johana, un recordatorio de amor con corazones animados.">
  <meta property="og:title" content="Johana, te amo ❤️">
  <meta property="og:description" content="Un pequeño recordatorio de lo mucho que significas para mí.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================
       ROOT VARIABLES - Light & Dark Themes
       ======================================== */
    :root {
      /* Light Theme Colors */
      --bg-gradient-1: #ff9a9e;
      --bg-gradient-2: #fad0c4;
      --bg-gradient-3: #fecfef;
      --accent-primary: #ff407d;
      --accent-secondary: #ff6b9d;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.9);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --overlay-bg: rgba(0, 0, 0, 0.85);
    }

    body.dark-mode {
      /* Dark Theme Colors */
      --bg-gradient-1: #1a1a2e;
      --bg-gradient-2: #16213e;
      --bg-gradient-3: #0f3460;
      --accent-primary: #e94560;
      --accent-secondary: #f06292;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --overlay-bg: rgba(0, 0, 0, 0.95);
    }

    /* ========================================
       GLOBAL STYLES & RESET
       ======================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
      transition: background 0.5s ease;
      position: relative;
    }

    /* ========================================
       SCROLL PROGRESS BAR
       ======================================== */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      z-index: 9999;
      width: 0%;
      transition: width 0.1s ease;
      box-shadow: 0 0 10px var(--accent-primary);
    }

    /* ========================================
       THEME TOGGLE BUTTON
       ======================================== */
    #theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border);
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    #theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 6px 20px var(--shadow-color);
    }

    #theme-toggle svg {
      width: 30px;
      height: 30px;
      fill: var(--text-primary);
      transition: transform 0.3s ease;
    }

    /* ========================================
       SCROLL TO TOP BUTTON
       ======================================== */
    #scroll-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: white;
      border: none;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    #scroll-top.visible {
      opacity: 1;
      visibility: visible;
    }

    #scroll-top:hover {
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* ========================================
       MAIN SPLASH SECTION
       ======================================== */
    .splash {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .center {
      text-align: center;
      padding: 50px 40px;
      border-radius: 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px var(--shadow-color);
      max-width: 900px;
      width: 100%;
      position: relative;
      z-index: 10;
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 800;
      margin: 0;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .lead {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      margin: 20px 0 30px;
      opacity: 0.95;
      font-weight: 300;
      line-height: 1.6;
    }

    /* ========================================
       ANIMATED HEART
       ======================================== */
    .heart {
      width: 90px;
      height: 90px;
      position: relative;
      animation: pulse 1.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px var(--accent-primary));
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 30%;
      width: 50%;
      height: 70%;
      background: var(--accent-primary);
      border-radius: 50%;
    }

    .heart::before {
      transform: translate(-80%, -10%) rotate(-45deg);
    }

    .heart::after {
      transform: translate(-20%, -10%) rotate(45deg);
    }

    .heart .base {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 70%;
      height: 70%;
      background: var(--accent-primary);
      transform: translate(-50%, -10%);
      border-radius: 18px 18px 20px 20px;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
      }
      50% {
        transform: scale(1.05);
      }
    }

    /* ========================================
       FLOATING HEARTS
       ======================================== */
    .floating-heart {
      position: absolute;
      bottom: -50px;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
    }

    /* ========================================
       BUTTONS
       ======================================== */
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border);
      padding: 14px 28px;
      border-radius: 50px;
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px var(--shadow-color);
      border-color: var(--accent-primary);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    /* ========================================
       DAYS TOGETHER COUNTER
       ======================================== */
    .counter-section {
      margin: 60px auto;
      max-width: 600px;
      padding: 40px 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      box-shadow: 0 8px 32px var(--shadow-color);
      text-align: center;
      animation: fadeInUp 1s ease 0.3s both;
    }

    .counter-section h2 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 25px;
      font-weight: 700;
    }

    #days-counter {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 20px 0;
      line-height: 1;
    }

    .counter-label {
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.9;
      font-weight: 300;
    }

    /* ========================================
       LOVE MESSAGES SECTION
       ======================================== */
    .love-messages {
      margin: 60px auto;
      max-width: 800px;
      padding: 40px 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      box-shadow: 0 8px 32px var(--shadow-color);
      text-align: center;
      animation: fadeInUp 1s ease 0.6s both;
    }

    .love-messages h2 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 30px;
      font-weight: 700;
    }

    #love-message {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-style: italic;
      margin: 25px 0;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
      font-weight: 300;
      transition: all 0.5s ease;
    }

    #new-message-btn {
      margin-top: 20px;
    }

    .message-fade {
      animation: messageFade 0.5s ease;
    }

    @keyframes messageFade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ========================================
       GALLERY SECTION
       ======================================== */
    .gallery {
      margin: 80px auto;
      max-width: 1200px;
      padding: 0 20px 80px;
      animation: fadeInUp 1s ease 0.9s both;
    }

    .gallery h2 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      margin-bottom: 40px;
      text-align: center;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      cursor: pointer;
      aspect-ratio: 1;
      box-shadow: 0 8px 25px var(--shadow-color);
      transition: all 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 40px var(--shadow-color);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.3));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .gallery-item:hover::before {
      opacity: 1;
    }

    /* Loading placeholder */
    .gallery-item.loading {
      background: linear-gradient(90deg, var(--glass-bg) 25%, rgba(255, 255, 255, 0.15) 50%, var(--glass-bg) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ========================================
       LIGHTBOX
       ======================================== */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 10000;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox-content {
      position: relative;
      max-width: 95%;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 15px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .lightbox-img.zoomed {
      transform: scale(1.5);
      cursor: zoom-out;
    }

    .lightbox-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10001;
    }

    .lightbox-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 20px;
    }

    .lightbox-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 10px;
    }

    .lightbox-nav.prev {
      left: 20px;
    }

    .lightbox-nav.next {
      right: 20px;
    }

    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.15);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
    }

    /* ========================================
       RESPONSIVE BREAKPOINTS
       ======================================== */
    @media (max-width: 768px) {
      .center {
        padding: 35px 25px;
      }

      .controls {
        gap: 10px;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.9rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
      }

      .counter-section,
      .love-messages {
        margin: 40px 20px;
        padding: 30px 20px;
      }

      #theme-toggle {
        width: 50px;
        height: 50px;
        top: 15px;
        right: 15px;
      }

      #theme-toggle svg {
        width: 24px;
        height: 24px;
      }

      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .lightbox-nav.prev {
        left: 10px;
      }

      .lightbox-nav.next {
        right: 10px;
      }

      .lightbox-img.zoomed {
        transform: scale(1.2);
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .header-content {
        gap: 15px;
      }

      .heart {
        width: 70px;
        height: 70px;
      }
    }

    /* ========================================
       LOADING SPINNER
       ======================================== */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 80px;
      height: 80px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========================================
       ACCESSIBILITY
       ======================================== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* Focus styles for accessibility */
    *:focus {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    button:focus,
    .btn:focus {
      outline: 2px solid var(--accent-primary);
      outline-offset: 3px;
    }

    /* ========================================
       PRINT STYLES
       ======================================== */
    @media print {
      .controls,
      #theme-toggle,
      #scroll-top,
      #scroll-progress,
      .floating-heart {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Scroll Progress Bar -->
  <div id="scroll-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Theme Toggle Button -->
  <button id="theme-toggle" aria-label="Toggle dark/light mode" title="Cambiar tema">
    <svg id="theme-icon" viewBox="0 0 24 24">
      <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
  </button>

  <!-- Scroll to Top Button -->
  <button id="scroll-top" aria-label="Scroll to top" title="Volver arriba">↑</button>

  <!-- Main Splash Section -->
  <main class="splash" id="splash">
    <div class="center">
      <div class="header-content">
        <div class="heart" role="img" aria-label="Animated heart">
          <div class="base"></div>
        </div>
        <h1>Johana, te amo</h1>
      </div>
      <p class="lead">Un pequeño recordatorio de lo mucho que significas para mí. ❤️</p>
      <div class="controls">
        <button class="btn" id="sendBtn" aria-label="Send hearts">✉️ Enviar</button>
        <button class="btn" id="replayBtn" aria-label="Replay animation">🔄 Repetir</button>
        <button class="btn" id="shareBtn" aria-label="Share page">📤 Compartir</button>
      </div>
    </div>
  </main>

  <!-- Days Together Counter -->
  <section class="counter-section">
    <h2>💕 Juntos por</h2>
    <div id="days-counter" aria-live="polite">0</div>
    <p class="counter-label">días de amor</p>
  </section>

  <!-- Love Messages Section -->
  <section class="love-messages">
    <h2>💌 Mensaje de amor</h2>
    <div id="love-message" aria-live="polite"></div>
    <button class="btn" id="new-message-btn">💝 Nuevo mensaje</button>
  </section>

  <!-- Gallery Section -->
  <section class="gallery">
    <h2>📸 Nuestros recuerdos</h2>
    <div class="gallery-grid" id="gallery-grid" role="list">
      <!-- Images will be loaded dynamically -->
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-controls">
      <button class="lightbox-btn" id="zoom-btn" aria-label="Zoom image" title="Zoom">🔍</button>
      <button class="lightbox-btn" id="download-btn" aria-label="Download image" title="Descargar">⬇️</button>
      <button class="lightbox-btn" id="close-btn" aria-label="Close lightbox" title="Cerrar">✕</button>
    </div>
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightbox-img" alt="Full size image">
    </div>
    <div class="lightbox-nav prev">
      <button class="nav-btn" id="prev-btn" aria-label="Previous image">‹</button>
    </div>
    <div class="lightbox-nav next">
      <button class="nav-btn" id="next-btn" aria-label="Next image">›</button>
    </div>
    <div class="lightbox-counter" id="lightbox-counter" aria-live="polite">1 / 1</div>
  </div>

  <script>
    /* ========================================
       CONSTANTS AND GLOBAL VARIABLES
       ======================================== */
    const SPECIAL_DATE = new Date('2025-09-08'); // Adjust this to your special date
    const LOVE_MESSAGES = [
      "Cada momento contigo es un regalo que atesoro en mi corazón.",
      "Tu sonrisa ilumina mis días más oscuros.",
      "Eres mi persona favorita en todo el universo.",
      "Contigo, cada día es una nueva aventura de amor.",
      "Tu amor me hace ser mejor persona cada día.",
      "Eres la razón por la que creo en los milagros.",
      "Mi corazón late más fuerte cuando estás cerca.",
      "Eres mi sueño hecho realidad.",
      "Tu felicidad es mi felicidad.",
      "No imagino mi vida sin ti.",
      "Eres mi hogar, mi refugio, mi todo.",
      "Cada día te amo más que ayer y menos que mañana.",
      "Tu amor es la mejor parte de mi día.",
      "Eres la melodía más hermosa de mi vida.",
      "Contigo aprendí el verdadero significado del amor."
    ];

    let currentImageIndex = 0;
    let allImages = [];
    let isZoomed = false;
    let touchStartX = 0;
    let touchEndX = 0;

    /* ========================================
       INITIALIZATION
       ======================================== */
    document.addEventListener('DOMContentLoaded', function() {
      initTheme();
      initScrollProgress();
      initScrollToTop();
      initFloatingHearts();
      initButtons();
      initDaysCounter();
      initLoveMessages();
      initDynamicGallery();
      initLightbox();
      
      // Hide loader after page loads
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
      }, 500);
    });

    /* ========================================
       THEME TOGGLE
       ======================================== */
    function initTheme() {
      const themeToggle = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const savedTheme = localStorage.getItem('theme');
      
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        updateThemeIcon(true);
      }

      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
      });
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (isDark) {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        icon.innerHTML = '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
      }
    }

    /* ========================================
       SCROLL PROGRESS BAR
       ======================================== */
    function initScrollProgress() {
      const progressBar = document.getElementById('scroll-progress');
      
      window.addEventListener('scroll', () => {
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight - windowHeight;
        const scrolled = window.scrollY;
        const progress = (scrolled / documentHeight) * 100;
        
        progressBar.style.width = progress + '%';
        progressBar.setAttribute('aria-valuenow', Math.round(progress));
      });
    }

    /* ========================================
       SCROLL TO TOP BUTTON
       ======================================== */
    function initScrollToTop() {
      const scrollTopBtn = document.getElementById('scroll-top');
      
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add('visible');
        } else {
          scrollTopBtn.classList.remove('visible');
        }
      });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }

    /* ========================================
       FLOATING HEARTS
       ======================================== */
    function initFloatingHearts() {
      const container = document.getElementById('splash');
      
      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function makeFloatingHeart() {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        
        // Random size
        const size = Math.round(rand(20, 60));
        heart.style.left = rand(5, 95) + '%';
        
        // Random colors for variety
        const colors = ['#ff407d', '#ff6b9d', '#ff8fab', '#ffb3c1', '#ffc0cb'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        // Random rotation for variety
        const rotation = rand(-20, 20);
        
        heart.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="transform: rotate(${rotation}deg)">
          <path d="M12 21s-7.2-4.35-9.2-7.2C-1.2 9.8 4 4 7 6.6 9.6 8.8 12 11 12 11s2.4-2.2 5-4.4c3-2.6 8.2 3.2 4.4 7.2C19.2 16.65 12 21 12 21z"/>
        </svg>`;
        
        container.appendChild(heart);
        
        const endY = -150 - size;
        const duration = rand(4000, 8000);
        const lateralMovement = rand(-50, 50);
        
        heart.animate([
          { transform: 'translateY(0px) translateX(0px)', opacity: 1 },
          { transform: `translateY(${endY / 2}px) translateX(${lateralMovement / 2}px)`, opacity: 0.8 },
          { transform: `translateY(${endY}px) translateX(${lateralMovement}px)`, opacity: 0 }
        ], {
          duration: duration,
          easing: 'ease-out'
        }).onfinish = () => heart.remove();
      }

      // Create hearts at interval
      setInterval(makeFloatingHeart, 600);
    }

    /* ========================================
       BUTTON INTERACTIONS
       ======================================== */
    function initButtons() {
      const sendBtn = document.getElementById('sendBtn');
      const replayBtn = document.getElementById('replayBtn');
      const shareBtn = document.getElementById('shareBtn');
      const heart = document.querySelector('.heart');

      // Send button - heart explosion
      sendBtn.addEventListener('click', () => {
        const container = document.getElementById('splash');
        
        // Create explosion of hearts
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            const size = Math.round(Math.random() * 40 + 30);
            const angle = (Math.PI * 2 * i) / 30;
            const distance = Math.random() * 200 + 100;
            const startX = 50;
            const startY = 50;
            const endX = startX + Math.cos(angle) * distance;
            const endY = startY + Math.sin(angle) * distance;
            
            heart.style.left = startX + '%';
            heart.style.top = startY + '%';
            
            const colors = ['#ff407d', '#ff6b9d', '#ff8fab', '#ffb3c1'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            heart.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
              <path d="M12 21s-7.2-4.35-9.2-7.2C-1.2 9.8 4 4 7 6.6 9.6 8.8 12 11 12 11s2.4-2.2 5-4.4c3-2.6 8.2 3.2 4.4 7.2C19.2 16.65 12 21 12 21z"/>
            </svg>`;
            
            container.appendChild(heart);
            
            heart.animate([
              { 
                transform: 'translate(0, 0) scale(0) rotate(0deg)', 
                opacity: 1 
              },
              { 
                transform: `translate(${(endX - startX) * 2}%, ${(endY - startY) * 2}%) scale(1) rotate(${Math.random() * 360}deg)`, 
                opacity: 0 
              }
            ], {
              duration: 1500 + Math.random() * 1000,
              easing: 'cubic-bezier(0, 0.5, 0.5, 1)'
            }).onfinish = () => heart.remove();
          }, i * 30);
        }

        // Visual feedback
        sendBtn.style.transform = 'scale(0.9)';
        setTimeout(() => {
          sendBtn.style.transform = '';
        }, 100);
      });

      // Replay button - pulse animation
      replayBtn.addEventListener('click', () => {
        heart.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(1.3) rotate(5deg)' },
          { transform: 'scale(0.9) rotate(-5deg)' },
          { transform: 'scale(1.2)' },
          { transform: 'scale(1)' }
        ], {
          duration: 800,
          easing: 'ease-in-out'
        });
      });

      // Share button - with feedback
      shareBtn.addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Johana, te amo ❤️',
              text: 'Un pequeño recordatorio de lo mucho que significas para mí.',
              url: window.location.href
            });
            
            // Success feedback
            shareBtn.innerHTML = '✓ Compartido';
            setTimeout(() => {
              shareBtn.innerHTML = '📤 Compartir';
            }, 2000);
          } catch (err) {
            console.log('Share cancelled or failed:', err);
          }
        } else {
          // Fallback - copy to clipboard
          navigator.clipboard.writeText(window.location.href);
          shareBtn.innerHTML = '✓ Copiado';
          setTimeout(() => {
            shareBtn.innerHTML = '📤 Compartir';
          }, 2000);
        }
      });
    }

    /* ========================================
       DAYS TOGETHER COUNTER
       ======================================== */
    function initDaysCounter() {
      function updateCounter() {
        const today = new Date();
        const diffTime = Math.abs(today - SPECIAL_DATE);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        const counter = document.getElementById('days-counter');
        counter.textContent = diffDays.toLocaleString();
      }

      updateCounter();
      // Update every hour
      setInterval(updateCounter, 3600000);
    }

    /* ========================================
       LOVE MESSAGES
       ======================================== */
    function initLoveMessages() {
      const messageEl = document.getElementById('love-message');
      const newMessageBtn = document.getElementById('new-message-btn');
      
      function showRandomMessage() {
        const randomMessage = LOVE_MESSAGES[Math.floor(Math.random() * LOVE_MESSAGES.length)];
        
        messageEl.classList.add('message-fade');
        
        setTimeout(() => {
          messageEl.textContent = `"${randomMessage}"`;
          messageEl.classList.remove('message-fade');
        }, 250);
      }

      // Show initial message
      showRandomMessage();

      newMessageBtn.addEventListener('click', showRandomMessage);
    }

    /* ========================================
       LOAD IMAGES FROM GITHUB API
       ======================================== */
    async function loadImagesFromGitHub() {
      const owner = 'JDMira98';
      const repo = 'joha';
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
      
      try {
        const response = await fetch(apiUrl);
        
        // Validate HTTP response status
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}: ${response.statusText}`);
        }
        
        const files = await response.json();
        
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
        const imageFiles = files.filter(file => 
          file.type === 'file' && 
          imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext))
        );
        
        return imageFiles.map(file => ({
          url: file.download_url,
          name: file.name
        }));
      } catch (error) {
        console.error('Error loading images:', error);
        return [];
      }
    }

    /* ========================================
       DYNAMIC GALLERY - Auto-load images
       ======================================== */
    async function initDynamicGallery() {
      const galleryGrid = document.getElementById('gallery-grid');
      
      // Cargar imágenes desde GitHub API
      const images = await loadImagesFromGitHub();
      
      // Handle case when no images are found
      if (images.length === 0) {
        console.warn('No images found in repository');
        galleryGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px;">No se encontraron imágenes en el repositorio.</p>';
        return;
      }
      
      allImages = images.map(img => img.url);
      
      // Create gallery items
      images.forEach((image, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item loading';
        item.setAttribute('role', 'listitem');
        
        const img = document.createElement('img');
        img.src = image.url;
        img.alt = `Recuerdo ${index + 1} - ${image.name}`;
        img.loading = 'lazy';
        
        // Remove loading class when image loads
        img.onload = () => {
          item.classList.remove('loading');
        };
        
        img.onerror = () => {
          // Remove from allImages array to keep it in sync with DOM
          const idx = allImages.indexOf(image.url);
          if (idx > -1) {
            allImages.splice(idx, 1);
          }
          item.remove();
        };
        
        item.appendChild(img);
        item.addEventListener('click', () => {
          // Find current index in allImages array
          const currentIndex = allImages.indexOf(image.url);
          if (currentIndex !== -1) {
            openLightbox(currentIndex);
          }
        });
        
        galleryGrid.appendChild(item);
      });
    }

    /* ========================================
       LIGHTBOX FUNCTIONALITY
       ======================================== */
    function initLightbox() {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = document.getElementById('close-btn');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const zoomBtn = document.getElementById('zoom-btn');
      const downloadBtn = document.getElementById('download-btn');

      // Close lightbox
      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      // Navigation
      prevBtn.addEventListener('click', () => navigateImage(-1));
      nextBtn.addEventListener('click', () => navigateImage(1));

      // Zoom
      zoomBtn.addEventListener('click', toggleZoom);
      lightboxImg.addEventListener('click', toggleZoom);

      // Download
      downloadBtn.addEventListener('click', downloadImage);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowLeft') navigateImage(-1);
          if (e.key === 'ArrowRight') navigateImage(1);
        }
      });

      // Touch/swipe support for mobile
      lightboxImg.addEventListener('touchstart', handleTouchStart, false);
      lightboxImg.addEventListener('touchend', handleTouchEnd, false);
    }

    function openLightbox(index) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      
      currentImageIndex = index;
      lightboxImg.src = allImages[index];
      lightbox.style.display = 'flex';
      updateLightboxCounter();
      isZoomed = false;
      lightboxImg.classList.remove('zoomed');
      
      // Prevent body scroll
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.style.display = 'none';
      isZoomed = false;
      document.getElementById('lightbox-img').classList.remove('zoomed');
      
      // Restore body scroll
      document.body.style.overflow = '';
    }

    function navigateImage(direction) {
      currentImageIndex += direction;
      
      if (currentImageIndex < 0) {
        currentImageIndex = allImages.length - 1;
      } else if (currentImageIndex >= allImages.length) {
        currentImageIndex = 0;
      }
      
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = allImages[currentImageIndex];
      updateLightboxCounter();
      isZoomed = false;
      lightboxImg.classList.remove('zoomed');
    }

    function toggleZoom() {
      const lightboxImg = document.getElementById('lightbox-img');
      isZoomed = !isZoomed;
      
      if (isZoomed) {
        lightboxImg.classList.add('zoomed');
      } else {
        lightboxImg.classList.remove('zoomed');
      }
    }

    function downloadImage() {
      const currentImage = allImages[currentImageIndex];
      const link = document.createElement('a');
      link.href = currentImage;
      link.download = currentImage.split('/').pop();
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function updateLightboxCounter() {
      const counter = document.getElementById('lightbox-counter');
      counter.textContent = `${currentImageIndex + 1} / ${allImages.length}`;
    }

    function handleTouchStart(e) {
      touchStartX = e.changedTouches[0].screenX;
    }

    function handleTouchEnd(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;
      
      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swipe left - next image
          navigateImage(1);
        } else {
          // Swipe right - previous image
          navigateImage(-1);
        }
      }
    }

    /* ========================================
       PERFORMANCE OPTIMIZATIONS
       ======================================== */
    
    // Lazy loading for images (built into HTML with loading="lazy")
    
    // Debounce scroll events
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Optimize scroll handlers
    const optimizedScrollHandler = debounce(() => {
      // Scroll handlers are already optimized
    }, 10);

    window.addEventListener('scroll', optimizedScrollHandler);
  </script>
