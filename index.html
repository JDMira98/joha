<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Johana, te amo ❤️</title>
  <meta name="description" content="Página especial para Johana, un recordatorio de amor con corazones animados." />
  <meta property="og:title" content="Johana, te amo ❤️">
  <meta property="og:description" content="Un pequeño recordatorio de lo mucho que significas para mí.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fecfef;
      --accent:#ff407d;
    }
    html,body{height:100%;margin:0;font-family:'Inter', sans-serif;background:linear-gradient(135deg,var(--bg1) 0%, var(--bg2) 100%);}
    .splash{height:100vh;display:grid;place-items:center;overflow:hidden;}
    .center{
      text-align:center;color:white;padding:28px;border-radius:20px;
      background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      backdrop-filter: blur(6px);box-shadow:0 8px 30px rgba(0,0,0,0.25);max-width:920px;width:min(92%,920px);
    }
    h1{font-size:clamp(28px,6vw,72px);margin:0 0 8px 0;line-height:1.02}
    p.lead{font-size:clamp(14px,2.2vw,18px);margin:0 0 18px 0;opacity:0.95}

    /* Heart */
    .heart{width:84px;height:84px;position:relative;animation:pulse 1.6s ease-in-out infinite;margin-right:12px}
    .heart::before,.heart::after{
      content:'';position:absolute;left:50%;top:30%;width:50%;height:70%;background:var(--accent);border-radius:50%;
    }
    .heart::before{transform:translate(-80%, -10%) rotate(-45deg);}
    .heart::after{transform:translate(-20%, -10%) rotate(45deg);}
    .heart .base{position:absolute;left:50%;top:48%;width:70%;height:70%;background:var(--accent);
      transform:translate(-50%, -10%);border-radius:18px 18px 20px 20px}
    @keyframes pulse{0%{transform:scale(0.94)}50%{transform:scale(1)}100%{transform:scale(0.94)}}

    .controls{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{background:rgba(255,255,255,0.12);border:0;padding:10px 16px;border-radius:10px;color:white;cursor:pointer;font-weight:600;transition:all 0.25s;}
    .btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-2px)}

    /* Gallery */
    .gallery{margin:50px auto;max-width:1100px;padding:0 20px;text-align:center;}
    .gallery h2{color:white;font-size:clamp(20px,4vw,32px);margin-bottom:20px}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
    .gallery-grid img{width:100%;border-radius:16px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,0.2);transition:transform 0.3s ease}
    .gallery-grid img:hover{transform:scale(1.05)}

    /* Lightbox */
    .lightbox{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;}
    .lightbox-img{max-width:90%;max-height:80%;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.6);}
    .lightbox .close{position:absolute;top:20px;right:35px;font-size:40px;font-weight:bold;color:white;cursor:pointer;}
    .lightbox-nav .prev,.lightbox-nav .next{cursor:pointer;position:absolute;top:50%;padding:16px;color:white;font-size:36px;user-select:none;}
    .lightbox-nav .prev{left:20px}.lightbox-nav .next{right:20px}
  </style>
</head>
<body>
  <main class="splash" id="splash">
    <div class="center">
      <div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap">
        <div class="heart"><div class="base"></div></div>
        <h1>Johana, te amo</h1>
      </div>
      <p class="lead">Un pequeño recordatorio de lo mucho que significas para mí. ❤️</p>
      <div class="controls">
        <button class="btn" id="sendBtn">Enviar</button>
        <button class="btn" id="replayBtn">Repetir</button>
        <button class="btn" id="shareBtn">Compartir</button>
      </div>
    </div>
  </main>

  <!-- Galería -->
  <section class="gallery">
    <h2>📸 Nuestros recuerdos</h2>
    <div class="gallery-grid">
      <img src="WhatsApp Image 2025-09-22 at 10.19.12 AM.jpeg" alt="Recuerdo 1">
      <img src="WhatsApp Image 2025-09-22 at 10.19.11 AM.jpeg" alt="Recuerdo 2">
      <img src="WhatsApp Image 2025-09-17 at 1.11.08 PM.jpeg" alt="Recuerdo 3">
      <img src="WhatsApp Image 2025-09-14 at 12.24.44 PM.jpeg" alt="Recuerdo 4">
      <img src="WhatsApp Image 2025-09-08 at 7.10.14 PM.jpeg" alt="Recuerdo 5">
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" id="lightbox-img">
    <div class="lightbox-nav">
      <span class="prev">&#10094;</span>
      <span class="next">&#10095;</span>
    </div>
  </div>

  <script>
    // Corazones flotantes
    const container=document.getElementById('splash');
    function rand(min,max){return Math.random()*(max-min)+min}
    function makeFloatingHeart(){
      const el=document.createElement('div');
      el.className='floating-heart';
      const size=Math.round(rand(18,48));
      el.style.left=rand(6,94)+'%';
      el.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="white"><path d="M12 21s-7.2-4.35-9.2-7.2C-1.2 9.8 4 4 7 6.6 9.6 8.8 12 11 12 11s2.4-2.2 5-4.4c3-2.6 8.2 3.2 4.4 7.2C19.2 16.65 12 21 12 21z"/></svg>`;
      container.appendChild(el);
      const endY=-120-size,duration=rand(3500,7000);
      el.animate([{transform:`translateY(0px)`,opacity:1},{transform:`translateY(${endY}px)`,opacity:0}],{duration,easing:'ease-out'}).onfinish=()=>el.remove();
    }
    setInterval(makeFloatingHeart,450);

    // Botones
    document.getElementById('replayBtn').onclick=()=>document.querySelector('.heart').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:520});
    document.getElementById('sendBtn').onclick=()=>{for(let i=0;i<18;i++) setTimeout(makeFloatingHeart,i*60+Math.random()*300);}
    document.getElementById('shareBtn').onclick=()=>{if(navigator.share){navigator.share({title:"Johana, te amo ❤️",text:"Un pequeño recordatorio de lo mucho que significas para mí.",url:window.location.href});}else{alert("Tu navegador no soporta compartir.");}}

    // Lightbox
    const galleryImgs=document.querySelectorAll('.gallery-grid img');
    const lightbox=document.getElementById('lightbox');
    const lightboxImg=document.getElementById('lightbox-img');
    const closeBtn=document.querySelector('.lightbox .close');
    const prev=document.querySelector('.lightbox-nav .prev');
    const next=document.querySelector('.lightbox-nav .next');
    let index=0;

    galleryImgs.forEach((img,i)=>img.onclick=()=>{lightbox.style.display='flex';lightboxImg.src=img.src;index=i;});
    closeBtn.onclick=()=>lightbox.style.display='none';
    prev.onclick=()=>showImg(index-1);
    next.onclick=()=>showImg(index+1);
    function showImg(i){if(i<0)i=galleryImgs.length-1;if(i>=galleryImgs.length)i=0;index=i;lightboxImg.src=galleryImgs[i].src;}
    window.onclick=e=>{if(e.target==lightbox)lightbox.style.display='none'}
  </script>
</body>
</html>
